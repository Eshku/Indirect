<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Procedural Atlas Generator</title>
		<script src="../../node_modules/pixi.js/dist/pixi.min.js"></script>
		<style>
			body {
				font-family: sans-serif;
				background-color: #2c2c2c;
				color: #f0f0f0;
				padding: 20px;
			}
			#controls {
				margin-bottom: 20px;
			}
			button {
				padding: 10px 15px;
				font-size: 16px;
				cursor: pointer;
			}
			#atlas-preview {
				border: 1px solid #555;
				background-color: #1a1a1a;
				display: inline-block;
			}
			#individual-previews {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				margin-top: 10px;
			}
			.preview-item {
				border: 1px solid #444;
				padding: 5px;
				background-color: #1a1a1a;
				text-align: center;
			}
			.preview-item p {
				margin: 0 0 5px 0;
			}
		</style>
	</head>
	<body>
		<h1>Procedural Texture Atlas Generator</h1>
		<div
			id="server-warning"
			style="display: none; background-color: #502a2a; border: 1px solid #ff4136; padding: 10px; margin-bottom: 20px"
		></div>
		<p>
			This tool generates a texture atlas and a corresponding JSON manifest. Click the button below to download the
			`atlas.png` and `atlas.json` files.
		</p>

		<div id="controls">
			<button id="generate-button">Generate and Download Atlas</button>
		</div>
		<div id="atlas-preview"></div>
		<hr style="margin: 20px 0; border-color: #555" />
		<h2>Individual Previews</h2>
		<div id="individual-previews"></div>

		<script>
			// --- Configuration ---
			const ATLAS_SIZE = 1024
			const PADDING = 2

			// --- Asset Definitions ---
			// Define procedural and image-based assets.
			const assets = [
				{
					name: 'spinningDrone',
					src: '../client/assets/sprites/spinningDrone.png',
					width: 32,
					height: 32,
				},
				{
					name: 'explosiveDrone',
					src: '../client/assets/sprites/explosiveDrone.png',
					width: 32,
					height: 32,
				},

				{
					name: 'player_ship',
					src: '../client/assets/sprites/player_ship.png',
					width: 32,
					height: 32,
				},

				{
					name: 'slashing_arc',
					src: '../client/assets/sprites/slashing_arc.png',
					width: 128,
					height: 64,
				},

				{
					name: 'shield',

					// "Crimson Shockwave" ---

					draw: (graphics, width, height) => {
						const radius = Math.min(width, height) / 2
						const canvas = document.createElement('canvas')
						const size = radius * 2
						canvas.width = size
						canvas.height = size
						const context = canvas.getContext('2d')
						const gradient = context.createRadialGradient(radius, radius, 0, radius, radius, radius)
						gradient.addColorStop(0, 'rgba(255, 50, 150, 0.9)') // Aggressive crimson core
						gradient.addColorStop(0.7, 'rgba(200, 40, 120, 0.2)') // Fades out to a darker crimson
						gradient.addColorStop(0.9, 'rgba(255, 80, 160, 0.9)') // Sharp, bright crimson outer ring
						gradient.addColorStop(1, 'rgba(255, 80, 160, 0.0)') // Ring fades to transparent
						context.fillStyle = gradient
						context.fillRect(0, 0, size, size)
						const texture = PIXI.Texture.from(canvas)
						graphics.circle(0, 0, radius).fill({ texture })
					},

					width: 128, // I have tried 128x128 and it looks good
					height: 128,
				},

				{
					name: 'aoe_pulse',

					draw: (graphics, width, height) => {
						const canvas = document.createElement('canvas')
						canvas.width = width
						canvas.height = height
						const ctx = canvas.getContext('2d')

						const centerX = width / 2
						const centerY = height / 2
						const radius = Math.min(width, height) / 2

						// --- BASE RADIAL VOID ---
						const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius)

						gradient.addColorStop(0, 'rgba(255, 120, 255, 0.9)')
						gradient.addColorStop(0.25, 'rgba(160, 50, 255, 0.6)')
						gradient.addColorStop(0.6, 'rgba(50, 0, 80, 0.3)')
						gradient.addColorStop(1, 'rgba(0, 0, 0, 0)')

						ctx.fillStyle = gradient
						ctx.fillRect(0, 0, width, height)

						// --- SHOCK RING ---
						ctx.beginPath()
						ctx.arc(centerX, centerY, radius * 0.75, 0, Math.PI * 2)

						ctx.strokeStyle = 'rgba(220, 120, 255, 0.8)'
						ctx.lineWidth = 3
						ctx.shadowColor = 'rgba(200, 80, 255, 0.8)'
						ctx.shadowBlur = 10
						ctx.stroke()

						// --- FRACTURE LINES (corruption cracks) ---
						for (let i = 0; i < 12; i++) {
							const angle = (i / 12) * Math.PI * 2
							const length = radius * (0.6 + Math.random() * 0.3)

							ctx.beginPath()
							ctx.moveTo(centerX, centerY)
							ctx.lineTo(centerX + Math.cos(angle) * length, centerY + Math.sin(angle) * length)

							ctx.strokeStyle = 'rgba(180, 80, 255, 0.4)'
							ctx.lineWidth = 1
							ctx.stroke()
						}

						// --- PARTICLE BURST ---
						for (let i = 0; i < 50; i++) {
							const angle = Math.random() * Math.PI * 2
							const dist = Math.random() * radius

							const x = centerX + Math.cos(angle) * dist
							const y = centerY + Math.sin(angle) * dist

							ctx.fillStyle = `rgba(200, 100, 255, ${Math.random() * 0.5})`
							ctx.fillRect(x, y, 2, 2)
						}

						const texture = PIXI.Texture.from(canvas)
						graphics.rect(-width / 2, -height / 2, width, height).fill({ texture })
					},

					width: 128,
					height: 128,
				},

				{
					name: 'slashing_arc_v1.1',

					draw: (graphics, width, height) => {
						const canvas = document.createElement('canvas')
						canvas.width = width
						canvas.height = height
						const ctx = canvas.getContext('2d')

						const cx = width / 2

						// --- MULTI-LAYER CURVES ---
						for (let layer = 0; layer < 4; layer++) {
							const offset = layer * 2
							const alpha = 0.25 + layer * 0.2

							ctx.beginPath()
							ctx.moveTo(0, height)

							ctx.quadraticCurveTo(cx, offset, width, height)
							ctx.quadraticCurveTo(cx, offset + 10, 0, height)

							ctx.closePath()

							const grad = ctx.createLinearGradient(0, 0, 0, height)
							grad.addColorStop(0, `rgba(220,120,255,${alpha})`)
							grad.addColorStop(1, `rgba(20,0,40,0)`)

							ctx.fillStyle = grad
							ctx.fill()
						}

						// --- EDGE CORE ---
						ctx.beginPath()
						ctx.moveTo(0, height)
						ctx.quadraticCurveTo(cx, 2, width, height)

						ctx.strokeStyle = 'rgba(255,180,255,0.9)'
						ctx.lineWidth = 2
						ctx.shadowBlur = 12
						ctx.shadowColor = 'rgba(200,100,255,0.9)'
						ctx.stroke()

						const texture = PIXI.Texture.from(canvas)
						graphics.rect(-width / 2, -height / 2, width, height).fill({ texture })
					},

					width: 128,
					height: 64,
				},
				{
					name: 'aoe_mech_hex',

					draw: (graphics, width, height) => {
						const canvas = document.createElement('canvas')
						canvas.width = width
						canvas.height = height
						const ctx = canvas.getContext('2d')

						const cx = width / 2
						const cy = height / 2
						const radius = width / 2

						// --- radial base (cold energy) ---
						const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius)
						grad.addColorStop(0, 'rgba(80,200,255,0.8)')
						grad.addColorStop(0.5, 'rgba(40,120,255,0.4)')
						grad.addColorStop(1, 'rgba(0,0,0,0)')
						ctx.fillStyle = grad
						ctx.fillRect(0, 0, width, height)

						// --- hex grid ---
						/* 						const hexSize = 10
						ctx.strokeStyle = 'rgba(120,220,255,0.25)'
						ctx.lineWidth = 1

						for (let y = -radius; y < radius; y += hexSize * 1.5) {
							for (let x = -radius; x < radius; x += hexSize * Math.sqrt(3)) {
								const offsetX = ((Math.floor(y / (hexSize * 1.5)) % 2) * hexSize * Math.sqrt(3)) / 2
								const px = cx + x + offsetX
								const py = cy + y

								ctx.beginPath()
								for (let i = 0; i < 6; i++) {
									const a = (Math.PI / 3) * i
									const hx = px + Math.cos(a) * hexSize
									const hy = py + Math.sin(a) * hexSize
									i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy)
								}
								ctx.closePath()
								ctx.stroke()
							}
						}
 */
						// --- outer ring ---
						ctx.beginPath()
						ctx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2)
						ctx.strokeStyle = 'rgba(180,240,255,0.9)'
						ctx.lineWidth = 3
						ctx.shadowBlur = 12
						ctx.shadowColor = 'rgba(120,220,255,0.9)'
						ctx.stroke()

						const texture = PIXI.Texture.from(canvas)
						graphics.rect(-width / 2, -height / 2, width, height).fill({ texture })
					},

					width: 128,
					height: 128,
				},
				{
					name: 'aoe_emp',

					draw: (graphics, width, height) => {
						const canvas = document.createElement('canvas')
						canvas.width = width
						canvas.height = height
						const ctx = canvas.getContext('2d')

						const cx = width / 2
						const cy = height / 2
						const radius = width / 2

						// base glow
						const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius)
						grad.addColorStop(0, 'rgba(255,255,255,0.9)')
						grad.addColorStop(0.3, 'rgba(100,180,255,0.6)')
						grad.addColorStop(1, 'rgba(0,0,0,0)')
						ctx.fillStyle = grad
						ctx.fillRect(0, 0, width, height)

						// lightning arcs
						for (let i = 0; i < 20; i++) {
							const angle = (i / 20) * Math.PI * 2
							const len = radius * (0.6 + Math.random() * 0.4)

							ctx.beginPath()
							ctx.moveTo(cx, cy)

							let segments = 4
							for (let s = 1; s <= segments; s++) {
								const t = s / segments
								const jitter = (Math.random() - 0.5) * 10
								const x = cx + Math.cos(angle) * len * t + jitter
								const y = cy + Math.sin(angle) * len * t + jitter
								ctx.lineTo(x, y)
							}

							ctx.strokeStyle = 'rgba(180,220,255,0.8)'
							ctx.lineWidth = 1.5
							ctx.stroke()
						}

						// ring
						ctx.beginPath()
						ctx.arc(cx, cy, radius * 0.7, 0, Math.PI * 2)
						ctx.strokeStyle = 'rgba(255,255,255,0.9)'
						ctx.lineWidth = 2
						ctx.stroke()

						const texture = PIXI.Texture.from(canvas)
						graphics.rect(-width / 2, -height / 2, width, height).fill({ texture })
					},

					width: 128,
					height: 128,
				},
				{
					name: 'aoe_target_break',

					draw: (graphics, width, height) => {
						const canvas = document.createElement('canvas')
						canvas.width = width
						canvas.height = height
						const ctx = canvas.getContext('2d')

						const cx = width / 2
						const cy = height / 2
						const radius = width / 2

						ctx.lineWidth = 2
						ctx.strokeStyle = 'rgba(255,80,80,0.9)'

						// segmented rings
						for (let r = 0.3; r <= 0.8; r += 0.2) {
							for (let i = 0; i < 8; i++) {
								const start = (i / 8) * Math.PI * 2
								const end = start + Math.PI / 6

								ctx.beginPath()
								ctx.arc(cx, cy, radius * r, start, end)
								ctx.stroke()
							}
						}

						// crosshair lines
						ctx.beginPath()
						ctx.moveTo(cx - radius, cy)
						ctx.lineTo(cx + radius, cy)
						ctx.moveTo(cx, cy - radius)
						ctx.lineTo(cx, cy + radius)
						ctx.stroke()

						// center flash
						const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.5)
						grad.addColorStop(0, 'rgba(255,120,120,0.9)')
						grad.addColorStop(1, 'rgba(0,0,0,0)')
						ctx.fillStyle = grad
						ctx.fillRect(0, 0, width, height)

						const texture = PIXI.Texture.from(canvas)
						graphics.rect(-width / 2, -height / 2, width, height).fill({ texture })
					},

					width: 128,
					height: 128,
				},

				{
					name: 'aoe_explosion_core',

					draw: (graphics, width, height) => {
						const canvas = document.createElement('canvas')
						canvas.width = width
						canvas.height = height
						const ctx = canvas.getContext('2d')

						const cx = width / 2
						const cy = height / 2
						const radius = width / 2

						// --- HOT CORE ---
						const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.4)
						coreGrad.addColorStop(0, 'rgba(255,255,200,1)')
						coreGrad.addColorStop(0.3, 'rgba(255,200,80,0.9)')
						coreGrad.addColorStop(1, 'rgba(255,80,0,0)')
						ctx.fillStyle = coreGrad
						ctx.fillRect(0, 0, width, height)

						// --- SPIKE BURST ---
						for (let i = 0; i < 20; i++) {
							const angle = (i / 20) * Math.PI * 2
							const spikeLen = radius * (0.6 + Math.random() * 0.4)
							const spread = 0.1

							ctx.beginPath()
							ctx.moveTo(cx, cy)

							ctx.lineTo(cx + Math.cos(angle - spread) * spikeLen, cy + Math.sin(angle - spread) * spikeLen)

							ctx.lineTo(cx + Math.cos(angle + spread) * spikeLen, cy + Math.sin(angle + spread) * spikeLen)

							ctx.closePath()

							ctx.fillStyle = 'rgba(255,60,0,0.7)'
							ctx.fill()
						}

						// --- OUTER SHOCK RING ---
						ctx.beginPath()
						ctx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2)
						ctx.strokeStyle = 'rgba(255,120,60,0.9)'
						ctx.lineWidth = 3
						ctx.shadowBlur = 15
						ctx.shadowColor = 'rgba(255,80,0,0.9)'
						ctx.stroke()

						const texture = PIXI.Texture.from(canvas)
						graphics.rect(-width / 2, -height / 2, width, height).fill({ texture })
					},

					width: 128,
					height: 128,
				},


				{
					name: 'smallExplosionEffect',

					draw: (graphics, width, height) => {
						const canvas = document.createElement('canvas')
						canvas.width = width
						canvas.height = height
						const ctx = canvas.getContext('2d')

						const cx = width / 2
						const cy = height / 2
						const radius = width / 2

						// --- pulsing ring (main gameplay read) ---
						ctx.beginPath()
						ctx.arc(cx, cy, radius * 0.8, 0, Math.PI * 2)
						ctx.strokeStyle = 'rgba(255,50,50,1)'
						ctx.lineWidth = 8
						ctx.shadowBlur = 40
						ctx.shadowColor = 'rgba(255,0,0,1)'
						ctx.stroke()

						// --- noisy inner blast ---
						for (let i = 0; i < 160; i++) {
							const angle = Math.random() * Math.PI * 2
							const dist = Math.random() * radius * 0.6

							const x = cx + Math.cos(angle) * dist
							const y = cy + Math.sin(angle) * dist

							ctx.fillStyle = `rgba(255,${Math.random() * 120},0,0.8)`
							ctx.fillRect(x, y, 5, 5)
						}

						// --- hot center ---
						const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.4)
						grad.addColorStop(0, 'rgba(255,255,180,1)')
						grad.addColorStop(1, 'rgba(255,80,0,0)')
						ctx.fillStyle = grad
						ctx.fillRect(0, 0, width, height)

						const texture = PIXI.Texture.from(canvas)
						graphics.rect(-width / 2, -height / 2, width, height).fill({ texture })
					},

					width: 256,
					height: 256,
				},

				// npx http-server . -p 8080

				/* 				{
					name: 'projectile_player',
					draw: (graphics, width, height) => {
						const radius = Math.min(width, height) / 2
						graphics.circle(0, 0, radius).fill({ color: 0x7fdbff, alpha: 1 })
					},
					width: 4,
					height: 4,
				}, */
			]

			/**
			 * Calculates the next power of two for a given number.
			 * E.g., nextPowerOfTwo(70) will return 128.
			 * @param {number} n The input number.
			 * @returns {number} The next power of two.
			 */
			function nextPowerOfTwo(n) {
				if (n === 0) return 1
				let p = 1
				while (p < n) p <<= 1
				return p
			}
			/**
			 * Calculates the position and size for each asset in the atlas.
			 * This uses a simple row-based packing algorithm.
			 * @param {object[]} assets - The array of asset definitions.
			 * @param {number} atlasSize - The width and height of the atlas canvas.
			 * @param {number} padding - The space to leave between assets.
			 * @returns {{frames: object, contentBounds: PIXI.Rectangle}} - The layout data.
			 * @throws {Error} If an asset is too large or if assets overflow the atlas.
			 */
			function performLayout(assets, atlasSize, padding) {
				const frames = {}
				let currentX = padding
				let currentY = padding
				let rowMaxHeight = 0
				let maxContentX = 0

				// Pre-process assets to ensure they have width and height, and check for size constraints.
				// This also provides backward compatibility for assets defined with 'size'.
				const processedAssets = assets.map(asset => {
					const width = asset.width ?? asset.size
					const height = asset.height ?? asset.size
					if (!width || !height) {
						throw new Error(`Asset "${asset.name}" is missing required 'size' or 'width'/'height' properties.`)
					}
					return { ...asset, width, height }
				})

				for (const asset of processedAssets) {
					if (asset.width + padding * 2 > atlasSize || asset.height + padding * 2 > atlasSize) {
						throw new Error(
							`Asset "${asset.name}" (size: ${asset.width}x${asset.height}) is too large to fit in the atlas (size: ${atlasSize}, padding: ${padding}).`,
						)
					}
				}

				for (const asset of processedAssets) {
					// If the current asset doesn't fit on this row, wrap to the next one.
					if (currentX + asset.width + padding > atlasSize) {
						maxContentX = Math.max(maxContentX, currentX)
						currentX = padding
						currentY += rowMaxHeight + padding
						rowMaxHeight = 0
					}

					// Check for vertical overflow before placing the asset.
					if (currentY + asset.height + padding > atlasSize) {
						throw new Error(
							`Atlas overflow: Not enough vertical space to place asset "${asset.name}". Consider increasing ATLAS_SIZE.`,
						)
					}

					frames[asset.name] = {
						frame: { x: currentX, y: currentY, w: asset.width, h: asset.height },
						sourceSize: { w: asset.width, h: asset.height },
					}

					currentX += asset.width + padding
					rowMaxHeight = Math.max(rowMaxHeight, asset.height)
				}

				// Calculate the final content bounds.
				const tightWidth = Math.max(maxContentX, currentX)
				const tightHeight = currentY + rowMaxHeight + padding
				// Round up to the next power of two for GPU efficiency (mipmapping, etc.).
				const potWidth = nextPowerOfTwo(tightWidth)
				const potHeight = nextPowerOfTwo(tightHeight)

				if (potWidth > atlasSize || potHeight > atlasSize) {
					throw new Error(`Calculated Power-of-Two size (${potWidth}x${potHeight}) exceeds ATLAS_SIZE (${atlasSize}).`)
				}

				const finalBounds = new PIXI.Rectangle(0, 0, potWidth, potHeight)

				return { frames, contentBounds: finalBounds }
			}

			/**
			 * Loads any assets that are defined with a 'src' path.
			 * Attaches the loaded PIXI.Texture to the asset object.
			 */
			async function loadSourceAssets() {
				const imageAssets = assets.filter(a => a.src)
				if (imageAssets.length === 0) return

				console.log('Loading external image assets...')
				const promises = imageAssets.map(async asset => {
					try {
						const texture = await PIXI.Assets.load(asset.src)
						asset.texture = texture // Attach loaded texture to the asset object
						console.log(`- Loaded ${asset.name} from ${asset.src}`)
					} catch (e) {
						console.error(`Failed to load asset "${asset.name}" from ${asset.src}`, e)
						throw new Error(`Failed to load ${asset.src}`)
					}
				})
				await Promise.all(promises)
				console.log('All external assets loaded.')
			}

			// --- PIXI Setup and Drawing Logic ---
			const app = new PIXI.Application()
			let atlasData = {}
			let contentBounds = new PIXI.Rectangle(0, 0, 0, 0)

			async function setup() {
				try {
					// Pre-load any external image assets before initializing the canvas.
					await loadSourceAssets()

					await app.init({
						width: ATLAS_SIZE,
						height: ATLAS_SIZE,
						backgroundColor: 0x000000,
						backgroundAlpha: 0, // Transparent background for the final PNG
					})
					document.getElementById('atlas-preview').appendChild(app.canvas)

					// 1. Perform layout calculation first. This separates logic from drawing.
					const layout = performLayout(assets, ATLAS_SIZE, PADDING)
					atlasData = {
						meta: {
							image: 'atlas.png',
							size: { w: layout.contentBounds.width, h: layout.contentBounds.height },
						},
						frames: layout.frames,
					}
					contentBounds = layout.contentBounds

					// 2. Draw the assets onto the main atlas canvas based on the layout.
					for (const asset of assets) {
						const frameInfo = atlasData.frames[asset.name].frame
						let displayObject

						if (asset.draw) {
							// Procedural asset
							const graphics = new PIXI.Graphics()
							graphics.position.set(frameInfo.x + frameInfo.w / 2, frameInfo.y + frameInfo.h / 2)
							asset.draw(graphics, frameInfo.w, frameInfo.h)
							displayObject = graphics
						} else if (asset.texture) {
							// Image-based asset
							const sprite = new PIXI.Sprite(asset.texture)
							const scale = Math.min(frameInfo.w / sprite.texture.width, frameInfo.h / sprite.texture.height)
							sprite.scale.set(scale)
							sprite.anchor.set(0.5)
							sprite.position.set(frameInfo.x + frameInfo.w / 2, frameInfo.y + frameInfo.h / 2)
							displayObject = sprite
						}
						if (displayObject) app.stage.addChild(displayObject)
					}

					// 3. Generate individual previews.
					await generateIndividualPreviews()
				} catch (error) {
					// Handle layout errors gracefully by showing a message and disabling the button.
					console.error('Error during atlas generation:', error)
					const errorElement = document.createElement('p')
					errorElement.style.color = 'red'
					errorElement.style.fontWeight = 'bold'
					errorElement.textContent = `Generation failed: ${error.message}`
					document.getElementById('controls').appendChild(errorElement)
					document.getElementById('generate-button').disabled = true
				}
			}

			async function generateIndividualPreviews() {
				const individualPreviewsContainer = document.getElementById('individual-previews')
				for (const asset of assets) {
					const assetWidth = asset.width ?? asset.size
					const assetHeight = asset.height ?? asset.size
					if (!assetWidth || !assetHeight) continue // Should have been caught by layout

					const previewWrapper = document.createElement('div')
					previewWrapper.className = 'preview-item'

					const label = document.createElement('p')
					label.textContent = `${asset.name} (${assetWidth}x${assetHeight})`
					previewWrapper.appendChild(label)

					const previewApp = new PIXI.Application()
					await previewApp.init({
						width: assetWidth,
						height: assetHeight,
						backgroundColor: 0x1a1a1a, // Match the preview background
					})

					let displayObject
					if (asset.draw) {
						const graphics = new PIXI.Graphics()
						graphics.position.set(assetWidth / 2, assetHeight / 2) // Center the drawing
						asset.draw(graphics, assetWidth, assetHeight)
						displayObject = graphics
					} else if (asset.texture) {
						const sprite = new PIXI.Sprite(asset.texture)
						const scale = Math.min(assetWidth / sprite.texture.width, assetHeight / sprite.texture.height)
						sprite.scale.set(scale)
						sprite.anchor.set(0.5)
						sprite.position.set(assetWidth / 2, assetHeight / 2)
						displayObject = sprite
					}
					if (displayObject) previewApp.stage.addChild(displayObject)

					previewWrapper.appendChild(previewApp.canvas)
					individualPreviewsContainer.appendChild(previewWrapper)
				}
			}

			// --- Download Logic ---
			function download(filename, data) {
				const element = document.createElement('a')
				element.setAttribute('href', data)
				element.setAttribute('download', filename)
				element.style.display = 'none'
				document.body.appendChild(element)
				element.click()
				document.body.removeChild(element)
			}

			document.getElementById('generate-button').addEventListener('click', async () => {
				// 1. Generate and download the JSON manifest
				const jsonString = JSON.stringify(atlasData, null, 2)
				const jsonBlob = new Blob([jsonString], { type: 'application/json' })
				const jsonUrl = URL.createObjectURL(jsonBlob)
				download('atlas.json', jsonUrl)
				URL.revokeObjectURL(jsonUrl)

				// 2. Generate and download the PNG image
				// Extract only the part of the canvas that contains content, preserving the padding.
				const imageBase64 = await app.renderer.extract.base64({
					target: app.stage,
					frame: contentBounds,
				})
				download('atlas.png', imageBase64)

				console.log('Atlas files generated and download initiated.')
			})

			// --- Initialization ---
			window.addEventListener('DOMContentLoaded', () => {
				if (window.location.protocol === 'file:') {
					const warning = document.getElementById('server-warning')
					warning.style.display = 'block'
					warning.innerHTML = `<strong>Warning:</strong> 
            <br>Due to security reasons and shit - run local server.
            <br><code>npx http-server . -p 8080</code>`
				}

				// Initialize the preview generation
				setup()
			})
		</script>
	</body>
</html>
